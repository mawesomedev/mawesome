name: npm-vm
description: Run the npm version a project declares in devEngines, whatever Node the job uses, with the download cached between runs.
author: Manzoor Ahmad Wani
branding:
  icon: package
  color: red
inputs:
  working-directory:
    description: The project whose devEngines.packageManager decides the npm version; defaults to the workspace root.
    required: false
    default: '.'
  version:
    description: An npm range or version to use instead of the project's declaration.
    required: false
  cache:
    description: Keep the verified npm tarball in the Actions cache between runs.
    required: false
    default: 'true'
outputs:
  version:
    description: The npm version every later step runs.
  kind:
    description: Where it came from (`own` for Node's bundled npm, `cached` or `download`).
  cli-path:
    description: Absolute path to that npm's `bin/npm-cli.js`.
  cache-hit:
    description: Whether the tarball came from the Actions cache (`true` or `false`).
runs:
  using: node24
  main: dist/index.js
