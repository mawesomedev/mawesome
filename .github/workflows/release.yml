name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight publish

# Least privilege: no permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  # Re-run the full gate (read-only) so nothing publishes without it.
  verify:
    name: 'Release: Verify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verification gate
        run: pnpm verify

  release:
    name: 'Release: Publish'
    needs: verify
    runs-on: ubuntu-latest
    # Configure a protected "npm-publish" environment (required reviewers / branch
    # restriction) in the repo settings, and scope each npm trusted-publisher entry to
    # it, for an extra approval gate before any publish.
    environment: npm-publish
    permissions:
      # The App token (minted below) handles the git push + Version PR, so the built-in
      # GITHUB_TOKEN needs no write — keep its blast radius minimal.
      contents: read
      id-token: write # npm OIDC trusted publishing (no NPM_TOKEN)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      # A GitHub App token — not the built-in GITHUB_TOKEN, whose events can't trigger other
      # workflows, so the Version PR it opens would never run CI. The App token makes the PR
      # (and the branch push) trigger `verify.yml` like a human-opened PR.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # No persisted credentials: changesets/action v2 pushes commits and tags via the
      # GitHub API using the `github-token` input, not the git CLI.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 bundles npm >= 11.5.1, which OIDC trusted publishing requires.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages # dist must exist for `changeset publish` (apps don't publish)
      - name: Create Version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # App token so the opened Version PR triggers CI; npm publish stays OIDC (id-token).
          # v2 configures auth only via this input; the GITHUB_TOKEN env var is not an alternative.
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: Prep release
          version-script: pnpm run version
          publish-script: pnpm run release
