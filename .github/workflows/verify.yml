name: Verify

# Pull requests are gated here; pushes to main are gated by the verify job in release.yml.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verification gate
        run: pnpm verify
      # Dogfood dependency-audit on our own packages (built by the gate above; non-packages are skipped).
      - name: Audit released imports
        run: node packages/dependency-audit/src/cli.ts packages/*

  # The full gate needs Node >=24.12 (internal .ts scripts rely on native type stripping), so this job exercises the published package's Node floor separately.
  # It installs and builds on Node 24, then runs dependency-audit's tests and built CLI on each supported Node line.
  node-compat:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 24, 26]
        include:
          # Windows shells don't expand globs, so exercise the built CLI + tests there on one representative Node line.
          - os: windows-latest
            node: 24
    steps:
      # harden-runner only supports Linux runners — skip it on Windows.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # check-latest so a stale runner-cached 24.x below the root >=24.12 floor can't be used.
      - name: Set up Node.js 24 (build toolchain)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          check-latest: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dependency-audit
        run: pnpm --filter @mawesome/dependency-audit build
      - name: Set up Node.js ${{ matrix.node }} (latest)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      # Invoke vitest directly: pnpm enforces the root engines (>=24.12) on every `pnpm run`, which would fail on the older matrix lines.
      - name: Run tests on Node ${{ matrix.node }}
        working-directory: packages/dependency-audit
        # bash on every OS (Git Bash on Windows) so the node_modules/.bin shim resolves uniformly.
        shell: bash
        run: node_modules/.bin/vitest run
      - name: Smoke-test the built CLI on Node ${{ matrix.node }}
        # A quoted "packages/*" stays literal in bash, so this exercises the CLI's own glob expansion.
        shell: bash
        run: |
          node packages/dependency-audit/dist/cli.js --version
          node packages/dependency-audit/dist/cli.js --no-progress "packages/*"

  # The pr-baseline action: the bundle builds, its README is generated from action.yml, and the consumer
  # workflow template passes actionlint and zizmor as a consumer would copy it.
  pr-baseline-action:
    name: pr-baseline action
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the action bundle
        run: pnpm --filter '@mawesome/pr-baseline-action...' build
      - name: Check the generated action README
        run: node actions/pr-baseline/scripts/generate-readme.ts --check
      # Runs the bundle the way the runner would, without a token: it must load, reject the mode and fail.
      - name: Smoke-test the bundle
        env:
          INPUT_MODE: dance
        run: |
          set +e
          output="$(node actions/pr-baseline/dist/index.js)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 1
          grep -q 'Unknown mode "dance"' <<<"$output"
      - name: Install actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern '*linux_amd64.tar.gz' -D "$RUNNER_TEMP/lint"
          tar -xzf "$RUNNER_TEMP"/lint/actionlint_*linux_amd64.tar.gz -C "$RUNNER_TEMP/lint" actionlint
          gh release download v1.30.0 --repo zizmorcore/zizmor --pattern '*x86_64-unknown-linux-gnu.tar.gz' -D "$RUNNER_TEMP/lint"
          tar -xzf "$RUNNER_TEMP"/lint/zizmor-*x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP/lint" zizmor
          echo "$RUNNER_TEMP/lint" >> "$GITHUB_PATH"
      - name: Lint the consumer workflow template
        run: node actions/pr-baseline/scripts/lint-workflow-template.ts
